<!-- WebMCP agent manifest: a single inert JSON block generated from the same YAML
     sources the templates render (site.data, site.posts), so agent-facing answers
     can never drift from the human-facing pages. Consumed by assets/js/webmcp.js,
     which only activates when the browser exposes the WebMCP ModelContext API. -->
<script type="application/json" data-webmcp-manifest>
{
  "site": {
    "title": {{ site.title | jsonify }},
    "url": {{ site.url | jsonify }},
    "description": {{ site.description | strip_newlines | jsonify }},
    "author": {{ site.author | jsonify }},
    "email": {{ site.email | jsonify }},
    "feed_url": {{ "/feed.xml" | absolute_url | jsonify }},
    "sitemap_url": {{ "/sitemap.xml" | absolute_url | jsonify }}
  },
  "navigation": {
    "primary": [{% for item in site.data.navigation.primary %}{"label": {{ item.label | jsonify }},"description": {{ item.description | jsonify }},"url": {{ item.url | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],
    "secondary": [{% for item in site.data.navigation.secondary %}{"label": {{ item.label | jsonify }},"url": {{ item.url | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
  },
  "profile": {
    "tagline": {{ site.data.identity.tagline | strip_newlines | jsonify }},
    "role": {{ site.data.identity.professional.generic_role | jsonify }},
    "current_title": {{ site.data.identity.professional.current_title | jsonify }},
    "current_company": {{ site.data.identity.professional.current_company | jsonify }},
    "location": {{ site.data.identity.location.lives_in | jsonify }},
    "skills": [{% for category in site.data.skills.categories %}{% for skill in category.skills %}{{ skill.name | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}{% unless forloop.last %},{% endunless %}{% endfor %}],
    "social_links": [{% for social in site.data.identity.social_links %}{"name": {{ social.name | jsonify }},"url": {{ social.url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
  },
  "now": {
    "updated_at": {{ site.data.now.updated_at | jsonify }},
    "focus": [{% for item in site.data.now.focus.items %}{% if item.project_key %}{% assign focus_project = site.data.projects.projects | where: "key", item.project_key | first %}{"marker": {{ item.marker | jsonify }},"title": {{ focus_project.title | default: item.project_key | jsonify }},"text": {{ item.note | jsonify }}}{% else %}{"marker": {{ item.marker | jsonify }},"title": {{ item.title | jsonify }},"text": {{ item.text | jsonify }}}{% endif %}{% unless forloop.last %},{% endunless %}{% endfor %}],
    "side_paths": {{ site.data.now.side_paths.items | jsonify }}
  },
  "projects": [{% for project in site.data.projects.projects %}{"key": {{ project.key | jsonify }},"title": {{ project.title | jsonify }},"category": {{ project.category | jsonify }},"role": {{ project.role | jsonify }},"status": {{ project.status_label | jsonify }},"summary": {{ project.summary | jsonify }},"repository_url": {{ project.repository_url | jsonify }},"tags": {{ project.tags | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "posts": [{% for post in site.posts %}{"title": {{ post.title | jsonify }},"url": {{ post.url | absolute_url | jsonify }},"date": {{ post.date | date_to_xmlschema | jsonify }},"resume": {{ post.resume | default: post.excerpt | strip_html | strip_newlines | truncate: 240 | jsonify }},"categories": {{ post.categories | jsonify }},"tags": {{ post.tags | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
}
</script>
