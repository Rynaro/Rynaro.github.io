<!--
  Epistemic-status ("assay") label (Story 3.1, AC-018). Renders the alchemist's
  purity read for `page.assay` against the closed three-value vocabulary
  CONVENTIONS.md fixed in Phase 0. Optional -- a post with no `assay:` field renders
  nothing.
  Params:
  - include.assay -- the raw assay value.
  - include.description_id -- optional ID of a visible explanation. List and
    card contexts intentionally omit it.
-->
{% assign assay_key = include.assay %}
{% if site.data.assay.labels[assay_key] %}
  {% assign assay_label = site.data.assay.labels[assay_key] %}
  {% assign assay_icon = site.data.assay.icons[assay_key] | default: "fas fa-vial" %}
  <span class="post-assay-label post-assay-label--{{ assay_key }}"{% if include.description_id %} aria-describedby="{{ include.description_id | escape }}"{% endif %}>
    <i class="{{ assay_icon }}" aria-hidden="true"></i>
    {{ assay_label }}
  </span>
{% endif %}
