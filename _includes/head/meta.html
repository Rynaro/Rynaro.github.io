<!-- Character encoding and viewport -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<!-- Primary Meta Tags -->
<title>{% if page.title %}{{ page.title | escape }} | Henrique A. Lavezzo{% else %}{{ site.title | escape }}{% endif %}</title>
{% assign page_description = page.resume | default: page.description | default: site.data.identity.tagline | strip_html | strip_newlines %}
<meta name="description" content="{{ page_description | truncate: 160 | escape }}">
{% assign meta_author = site.data.notebook_authors[page.author_id] %}
<meta name="author" content="{{ meta_author.name | default: page.author | default: site.author | escape }}">
{% include head/social.html description=page_description author=meta_author %}

<!-- Canonical link -->
<link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">

<!-- Theme color for browser UI -->
<meta name="theme-color" content="#4285f4">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
