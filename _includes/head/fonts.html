<!--
  self-host-fonts: fonts are vendored locally under assets/fonts/ -- no more
  Google Fonts CDN or Font Awesome (cdnjs) CDN requests of any kind. This
  fixes visitor privacy (no third-party IP leak on every page load, the same
  reason the site moved to cookie-free Plausible), render performance (three
  fewer render-blocking third-party requests), and visual-baseline
  determinism (the CDN race was the source of the page-height drift between
  baseline runs). preconnect/preload hints to those third parties are gone
  along with the requests they were hinting at.

  Inter / Roboto / Nothing You Could Do: declared as @font-face rules in
  _sass/_fonts.scss (imported early in assets/css/main.scss), not linked
  here -- they ship inside main.css so the browser doesn't need a second
  stylesheet request to discover them.
-->

<!-- Font Awesome 6.4.2 (Free) -- vendored verbatim from cdnjs, webfonts co-located
     in assets/fonts/; see assets/fonts/fontawesome.min.css for provenance/license. -->
<link rel="stylesheet" href="{{ "/assets/fonts/fontawesome.min.css" | relative_url }}">
