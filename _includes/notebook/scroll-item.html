<!--
  Shared "scroll" card partial (extracted from notebook.html so the same card renders
  identically on the All view, the per-category pages, and the homepage's surfaced
  content -- Story 2.1/2.2, AC-012/AC-013). Params: include.post, include.index (1-based,
  drives the rarity-stripe modulo, matching the previous inline behavior byte-for-byte).
-->
<div class="scroll-item" data-category="{{ include.post.categories | first }}">
  <div class="scroll-card">
    <div class="scroll-rarity
      {% assign mod = include.index | modulo: 5 %}
      {% if mod == 1 %}rare{% elsif mod == 3 %}epic{% else %}common{% endif %}
    "></div>

    <div class="scroll-header">
      <div class="scroll-metadata">
        <span class="scroll-date">{{ include.post.date | date: "%b %-d, %Y" }}</span>
        <span class="scroll-category">{{ include.post.categories | first | capitalize }}</span>
      </div>
      <h3 class="scroll-title">{{ include.post.title }}</h3>
    </div>

    <div class="scroll-content">
      <p class="scroll-excerpt">{{ include.post.resume | default: include.post.excerpt | strip_html | truncate: 120 }}</p>
    </div>

    <div class="scroll-footer">
      <div class="scroll-tags">
        {% for tag in include.post.tags limit:3 %}
          <span class="scroll-tag">#{{ tag }}</span>
        {% endfor %}
      </div>
      <a href="{{ include.post.url }}" class="scroll-link">
        <span>Read scroll</span>
        <i class="fas fa-scroll"></i>
      </a>
    </div>
  </div>
</div>
