name: Accessibility & Site Contracts

# Static site contracts, browser-level axe checks, and the sitemap-wide pa11y
# ratchet are separate blocking jobs. Node tooling is verification-only and is
# excluded from the generated GitHub Pages site.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  static-contracts:
    name: Static site contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Jekyll build
        run: bundle exec jekyll build

      - name: Full static contract suite
        run: npm run test:a11y-static

      - name: Visual harness CLI contracts
        run: npm run test:visual-cli

  axe-browser-audit:
    name: axe-core browser audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Jekyll build
        run: bundle exec jekyll build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run axe-core route matrix
        run: npm run test:axe

  pa11y-ratchet:
    name: pa11y-ci + axe over the sitemap, WCAG2AA (AC-039)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for pa11y
        run: npx playwright install --with-deps chromium

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Build with _config.ci.yml merged in, overriding `url:` to the local
      # server -- _config.yml's real `url: https://hlavezzo.me` would
      # otherwise bake production URLs into sitemap.xml, and pa11y-ci would
      # crawl the LIVE site instead of this PR's build. (Jekyll 4.4.1 has no
      # `--url` CLI flag -- "invalid option: --url" -- a merged config file
      # is the supported override mechanism.)
      - name: Jekyll build (url overridden to localhost via _config.ci.yml)
        run: bundle exec jekyll build --config _config.yml,_config.ci.yml

      - name: Serve the built site
        run: |
          nohup npx http-server _site -p 4000 -s > /tmp/http-server.log 2>&1 &
          npx wait-on http://localhost:4000/sitemap.xml

      - name: pa11y-ci (axe runner, WCAG2AA, over the sitemap)
        run: node scripts/pa11y-sitemap.mjs --sitemap http://localhost:4000/sitemap.xml --exclude "\\.xml(?:$|[?#])"
