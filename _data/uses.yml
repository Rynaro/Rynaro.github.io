familiars:
  eyebrow: Eidolon party
  title: Specialists, not a single oracle
  introduction: >-
    When AI joins the work, I route the task to a role with a clear responsibility.
    These are workflow boundaries—not rankings, decoration, or claims of model superiority.
  project_key: eidolons
  members:
    - { author_id: atlas, duty: "Scouts the terrain and returns evidence before a plan is drawn." }
    - { author_id: ramza, duty: "Turns intent and constraints into a decision-ready plan." }
    - { author_id: vivi, duty: "Implements an agreed shape and proves the result works." }
    - { author_id: forge, duty: "Examines trade-offs when the right path is not yet obvious." }
    - { author_id: vigil, duty: "Finds root causes when a system behaves against its design." }
    - { author_id: kupo, duty: "Handles bounded, mechanical work with a light touch." }

