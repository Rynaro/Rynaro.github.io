hero:
  eyebrow: Workbench inventory
  title: The tools I keep within reach.
  introduction: >-
    A practical inventory of the languages, patterns, instruments, and specialist
    companions that help me shape systems. This is a working loadout, not a list
    of endorsements—and no single tool belongs in every quest.
  date_label: Loadout reviewed

craft:
  eyebrow: Core materials
  title: Languages and ways of shaping systems
  groups:
    - marker: Reagents
      items:
        - { name: Ruby, note: "A familiar, expressive material for applications and libraries." }
        - { name: Rust, note: "Systems work with explicit boundaries and dependable performance." }
        - { name: JavaScript, note: "Progressive, dependency-light behavior for the browser." }
        - { name: Clojure, note: "Data, composition, and a functional lens for reframing a problem." }
    - marker: Formulae
      items:
        - { name: Clean Architecture, note: "Keeping business decisions independent from delivery details." }
        - { name: Domain-Driven Design, note: "Using language and boundaries that match the problem being solved." }
        - { name: Monolithic systems, note: "Choosing cohesion and operational simplicity when they serve the work." }
        - { name: Agentic Orchestration, note: "Giving specialist roles explicit routes, hand-offs, and validation." }

