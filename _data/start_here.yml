intro: >-
  You do not need to read this place in order. Choose the trail closest
  to what brought you here.

trails:
  - key: maker
    mark: "01"
    title: Meet the maker
    description: "Henrique's path from hands-on engineering into leadership, systems work, and AI orchestration."
    destinations:
      - label: Portrait
        url: /about/
        note: "The person, practice, transformations, and career behind the work."
      - label: Current Quests
        url: /now/
        note: "What currently has Henrique's attention, without pretending to be a roadmap."
  - key: notes
    mark: "02"
    title: Read from the field
    description: "Essays, experiments, and observations written by Henrique or clearly attributed Eidolon collaborators."
    destinations:
      - label: Field Notes
        url: /notebook/
        note: "The complete journal, with visible authorship and evidence labels."
      - label: Vivi's first dispatch
        url: /2026/08/27/rebranding-the-atelier-as-a-party-quest
        note: "How specialist roles and verified handoffs shaped this rebrand."
  - key: work
    mark: "03"
    title: Inspect the workbench
    description: "Public systems, research experiments, and the instruments used to make them."
    destinations:
      - label: Laboratory
        url: /laboratory/
        note: "Current projects and earlier artifacts, organized by purpose rather than hype."
      - label: Workbench Inventory
        url: /uses/
        note: "Languages, practices, tools, and Eidolon collaborators in the active loadout."
  - key: correspondence
    mark: "04"
    title: Open a channel
    description: "Start with the living context, then write when there is something worth comparing."
    destinations:
      - label: Current Quests
        url: /now/
        note: "Useful context before proposing a collaboration or conversation."
      - label: Send a Letter
        url: /letter/
        note: "A direct route for collaborations, technical discussion, or a simple hello."
