title: The Harmonic Seal
eyebrow: A playable folio
introduction: Bring the living sigils into harmony with the target chord.
invitation: Match the target chord by pulsing a sigil and each direct neighbour.
rule: A pulse changes its sigil and each direct neighbour, forming a cross.
tutorial:
  guided: Begin at the marked centre. Watch how one pulse travels.
  independent: Now compare both patterns and choose the next centre yourself.
  invalid: Begin with the marked centre sigil at row 3, column 3.
reflection:
  title: A note in the margin
  prompt: Would you open another folio now?
  note_label: Anything you would change? (optional)
  thanks: Thank you. This note stays only in this open page and is never sent or stored.
