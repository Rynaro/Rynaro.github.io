  - name: --ink-color
    kind: css-var
    hex: "#3a2921"
    role: content
    obligation: ink
    measured: {cream: 12.73, light: 11.77, parchment-dark: 10.44}
    note: Declared but currently has zero live color/border-color/fill usage (only a redundant redeclaration in _notebook.scss:7). Classified content/ink defensively; already passes everywhere.
  - name: --scroll-shadow
    kind: css-var
    role: ornament
    obligation: exempt

  # --- Letter specific colors ---
  - name: --letter-gradient-start
    kind: css-var
    hex: "#635b9c"
    role: ornament
    obligation: exempt
  - name: --letter-gradient-end
    kind: css-var
    hex: "#a55b95"
    role: ornament
    obligation: exempt
  - name: --letter-paper
