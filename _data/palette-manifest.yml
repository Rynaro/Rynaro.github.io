    note: Resolves to $text-dark (light) / #e0e0e0 (dark, prefers-color-scheme) -- both pre-existing, both passing on their own theme's surfaces (Phase 3, AC-025).

  # --- Sass color variables ($pastel-*, backgrounds, text) ---
  - name: $pastel-pink
    kind: sass-var
    hex: "#F8D1E0"
    role: ornament
