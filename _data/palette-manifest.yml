  # --- Rarity colors (WoW item-quality hues; near-black-UI palette on a light site) ---
  - name: --rarity-common
    kind: css-var
    hex: "#7c818c"
    role: ornament
    obligation: exempt
  - name: --rarity-uncommon
    kind: css-var
    hex: "#1eff00"
    role: ornament
    obligation: exempt
    note: >-
      DEAD TOKEN. `grep -rn "rarity-uncommon" _sass/` returns only its own
      declaration; no `.uncommon` rule exists anywhere, and
      laboratory.js's rarity switch falls through unknown tiers to "common".
      1.26:1 on cream -- would fail catastrophically if ever wired up. NOT
      rescued here (no dark-surface module built for a failure that cannot
      currently occur) -- see report. The AC-030 rarity label (Story 4.4a)
