not_manifest_scope:
  # Declared OUTSIDE _sass/_variables.scss -- AC-048's VERIFY scopes the
  # manifest to that one file ("enumerates every token declared in
  # _sass/_variables.scss"). Listed here for auditability, not as manifest
  # rows.
  - token: --symbol-color
    declared_at: "inline style, index.html (per alchemy-symbol element) / _sass/_home.scss (fallback only)"
    disposition: >-
      Ornament (5 ad hoc per-glyph hex values, e.g. #FF5E5B; decorative rune
      icon fill). One usage (home.scss:368, the .hovered::after name
      tooltip) renders real text (the rune's title) on a near-black
      rgba(33,28,48,0.85) background -- independently plausible-passing
      (light pastel-family colors on near-black) but not mechanically
      verified here since the token is out of manifest scope by declaration
      site. Logged for Phase 4b/5 follow-up, not blocking any of the 19 ACs.
  - token: --ring-color
    declared_at: "_sass/_home.scss (per-ring custom property, alchemy circle ornament)"
    disposition: Ornament, decorative ring stroke color, never text.
  - token: --post-text
    declared_at: "_sass/_post.scss:7 (`--post-text: var(--dnd-ink);`), dark-mode override _sass/_post.scss:1145"
    disposition: Alias of --dnd-ink (already content/ink, already passing) -- trivially safe, just declared locally instead of in _variables.scss.
  - token: --ff-purple-dark
    declared_at: NOWHERE
    disposition: >-
      BUG, found and fixed (not part of the 19 ACs, but adjacent and cheap):
      _sass/_post.scss:705 (`.article-content code`) referenced
      `var(--ff-purple-dark)`, a custom property declared nowhere in the
      codebase -- an undefined var() with no fallback, silently inheriting
      instead of erroring. Repointed to --ff-purple-ink (real body content:
      inline code text).

usage_exemptions:
  # AC-047 binds "a palette token referenced by a CSS color/border-color/fill
  # rule that renders body text or a meaning-bearing boundary" to a
  # content/ink token. These are the specific, narrow, individually-justified
  # usages of an ORNAMENT-role token via one of those three properties that
  # are NOT bound -- each has a documented reason and, where feasible, an
  # independently measured ratio. This list is deliberately short; it is the
  # anti-vacuity discipline, generalized from the logotype selector-set carve-out.
  - file: _sass/_about.scss
    line: 360
    selector: ".social-link:hover"
    property: border-color
    token: --ff-gold
    reason: >-
      Decorative color-echo border on a hover state whose STATE is already
      carried by an obvious, large background-color change on the same rule
      (background: var(--ff-gold) two lines up) -- the border does not
      independently convey the state.
  - file: _sass/_about.scss
    line: 848
    selector: ".current-quest .timeline-marker"
    property: border-color
    token: --ff-gold
    reason: "Same pattern -- border-color matches background: var(--ff-gold) on the same rule."
  - file: _sass/_about.scss
    lines: [960, 976, 993]
    selector: ".ability-type-ultimate, .ability-ultimate .ability-name/.ability-mana"
    property: "color"
    token: "--ff-gold, --dnd-brown"
    reason: >-
      KNOWN, MEASURED FAILURE, DELIBERATELY NOT FIXED HERE (line 960's
      --dnd-brown is plausibly fine on its own gold/#d4a017 gradient but not
      independently verified; lines 976/993's --ff-gold is independently
      MEASURED FAILING). This card's own background is a
      linear-gradient(135deg, var(--ff-purple), var(--ff-blue-dark)) -- not
      one of the four AC-026 declared backgrounds. Measured directly:
      --ff-gold on the gradient stops is 1.93:1 / 2.61:1 (fails); the
      light-background-oriented --ff-gold-ink is WORSE there (1.63/1.20),
      because it is tuned for cream/light/parchment-dark, not a dark card.
      Fixing this honestly needs a dedicated light value for this specific
      dark-gradient context (e.g. a near-white with a gold text-shadow), which
      is a small design decision, not a token swap -- out of this bounded
      pass. Logged for Phase 4b/5, not silently exempted as "fine."
  - file: _sass/_about.scss
    line: 1183
    selector: ".cta-title"
    property: color
    token: --ff-gold
    reason: >-
      Same category as the ability-ultimate cluster above: background is
      linear-gradient(135deg, var(--ff-blue-dark), var(--ff-purple)), not a
      declared background. Not independently verified passing; logged, not fixed.
  - file: _sass/_notebook.scss
    line: 163
    selector: ".glyph"
    property: color
    token: --ff-gold
    reason: >-
      Decorative ambient Unicode glyph (a floating symbol, not a text label)
      in the grimoire hero. Non-informational by design -- scheduled for
      `aria-hidden="true"` in Story 4.6 (AC-032, Phase 4b), which formalizes
      its decorative-only status; currently NOT aria-hidden, a gap logged
      for that pass.
  - file: _sass/_home.scss
    line: 104
    selector: ".hero-description"
    property: color
    token: $pastel-blue
    reason: >-
      Real content (the identity-line tagline), but independently measured
      passing against both declared hero-gradient stops: 9.86:1 / 8.12:1.
      No -ink variant needed since the base hex already clears 4.5:1 in its
      only content context.
  - file: _sass/_home.scss
    line: 115
    selector: ".hero-trademark"
    property: color
    token: "rgba($pastel-purple, 0.8)"
    reason: >-
      Real content (copyright text), independently measured by alpha-blending
      against both hero-gradient stops before computing contrast: 6.12:1 / 5.19:1.
  - file: _sass/_home.scss
    line: 63
    selector: ".hero-content"
    property: color
    token: $background-cream
    reason: "Sets the default hero text color; independently measured against both hero-gradient stops: 15.18:1 / 12.49:1."
  - file: _sass/_home.scss
    line: 79
    selector: ".hero-title"
    property: color
    token: $background-cream
    reason: "Same hero-gradient pairing as .hero-content, restated: 15.18:1 / 12.49:1."
  - file: _sass/_home.scss
    line: 352
    selector: ".alchemy-symbol, .rune"
    property: color
    token: "var(--symbol-color, $pastel-purple)"
    reason: >-
      $pastel-purple here is a fallback for --symbol-color (out of manifest
      scope, see not_manifest_scope) -- every actual rune element sets
      --symbol-color inline, so the $pastel-purple fallback never renders in
      practice. Decorative icon fill, not body text.
  - file: _sass/_components.scss
    line: 89
    selector: ".social-icon (--linkedin/--github/--dev)"
    property: color
    token: $background-cream
    reason: >-
      KNOWN, MEASURED FAILURE, DELIBERATELY NOT FIXED HERE. $background-cream
      text on the three brand-color icon fills measures 2.97:1 (#6E93B5
      linkedin), 3.90:1 (#7B7B7B github), 4.12:1 (#777 dev) -- all fail 4.5,
      and no available ink token rescues it either (the darkest, --ink-color,
      only reaches 3.09-4.28:1 against these same three fills): the icon FILL
      colors themselves are too light/medium to support any 4.5:1 text pairing.
      A real fix needs to darken the three brand-color fills, not swap the
      text token -- out of this bounded pass. Logged for Phase 4b/5. Compare
      to .button--primary/--outlined hover states (_components.scss:21,32),
      which had the identical defect shape and WERE fixed here (--ink-color
      clears 5.24:1 / 7.34:1 against those two fills).
  - file: _sass/_laboratory.scss
    lines: [626, 627, 628, 629]
