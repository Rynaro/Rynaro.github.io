  - name: --ff-blue
    kind: css-var
    hex: "#4499cb"
    role: ornament
    obligation: exempt
    note: >-
      Gradients/backgrounds/box-shadow glows only after Story 4.1 (its one
      content usage, about.scss .ability-mana, now reads --ff-blue-dark).
  - name: --ff-blue-dark
    kind: css-var
    hex: "#2e6792" # darken(#306d9a, 2%)
    role: content
    obligation: ink
    measured: {cream: 5.57, light: 5.15, parchment-dark: 4.57}
    note: >-
      Pre-existing token, darkened 2% further by this phase: the original
      #306d9a passed cream/light (5.12/4.73) but missed parchment-dark
      (4.19) -- caught by the contrast test's blanket cross-check against
      every declared background (matching research-ui-a11y.md §2.1's own
      table methodology: every token vs every one of the three light
      surfaces, not just the one its current usages happen to sit on).
  - name: --ff-gold
    kind: css-var
