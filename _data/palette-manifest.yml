# Every living color token declared by the shared settings layer has one
# rendering role and one corresponding contrast obligation.
meta:
  source:
    - _sass/settings/_variables.scss
  declared_backgrounds:
    cream: "#F8F5F2"
    light: "#F0ECE9"
    parchment-dark: "#e8e0c0"
  logotype_selectors: []
  content_threshold: 4.5
  boundary_threshold: 3.0

tokens:
  - {name: --border-light, kind: css-var, value: "rgba(153, 102, 204, 0.2)", role: ornament, obligation: exempt}
  - {name: --bg-primary, kind: css-var, role: ornament, obligation: exempt}
  - {name: --text-body, kind: css-var, role: content, obligation: ink}
  - {name: $pastel-purple, kind: sass-var, hex: "#CDB4DB", role: ornament, obligation: exempt}
  - name: $pastel-purple-ink
    kind: sass-var
    hex: "#764692"
    role: content
    obligation: ink
    measured: {cream: 6.32, light: 5.84, parchment-dark: 5.18}
  - name: $pastel-purple-ink-hover
    kind: sass-var
    hex: "#683e80"
    role: content
    obligation: ink
    measured: {cream: 7.47, light: 6.91, parchment-dark: 6.12}
  - {name: $background-cream, kind: sass-var, hex: "#F8F5F2", role: ornament, obligation: exempt}
  - name: $text-dark
    kind: sass-var
    hex: "#4A4A4A"
    role: content
    obligation: ink
    measured: {cream: 8.16, light: 7.55, parchment-dark: 6.69}
