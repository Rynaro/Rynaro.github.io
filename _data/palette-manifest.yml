# _data/palette-manifest.yml
#
# AC-047 / AC-048 (Story 4.1, Phase 4a). The committed manifest: every color
# TOKEN declared in `_sass/_variables.scss` (Sass `$variables` in the "Color
# Palette" / "Background and text colors" sections, plus CSS custom
# properties in the `:root` block) gets EXACTLY ONE `role` from
# {ornament, logotype, content} and EXACTLY ONE `obligation` from {ink,
# exempt}, under the fixed mapping `content <=> ink`, `ornament|logotype <=>
# exempt`. Scope is deliberately the tokens *declared* in `_variables.scss` --
# not every CSS custom property in the codebase (`--symbol-color`,
# `--ring-color`, `--post-text`, `--ff-purple-dark` are set/aliased locally in
# individual partials, not in _variables.scss; see `not_manifest_scope` below
# for what each of those actually is). Layout tokens ($sidebar-width,
# $content-max-width, $tablet-breakpoint, $mobile-breakpoint) are declared in
# the same file but are not colors -- "palette token" excludes them.
#
# Consumed by scripts/palette-manifest.test.mjs (AC-048: completeness +
# role<=>obligation consistency + logotype usage-binding) and
# scripts/token-usage.test.mjs (AC-047: every non-logotype color/border-color/
# fill usage in _sass/ resolves to a content/ink token, or is in the
# documented `usage_exemptions` below).
#
# GENERATED FROM MEASUREMENT, NOT PROSE: every ratio cited here is computed by
# scripts/lib/color-math.mjs (WCAG 2.x relative luminance, no rounding before
# comparison) and independently cross-checked against real `bundle exec sass`
# output for every darken() call (see scripts/repoint-ink-tokens.mjs history /
# the completion report for the verification transcript). Do not hand-edit a
# ratio without re-running the contrast test.

meta:
  source: _sass/_variables.scss
  declared_backgrounds:
    cream: "#F8F5F2"
    light: "#F0ECE9"
    parchment-dark: "#e8e0c0"
    hero-gradient-1: "#211C30"
    hero-gradient-2: "#312A45"
    # normalize-p1 / AC-108: the gold ground (`--ff-gold`, where `.scroll-seal`'s
    # text sits) and the consolidated dark canvas (`--dnd-parchment` in dark /
    # the literal several partials already paint their dark sections with) were
    # invisible to the contrast suite before P1 -- neither is a blanket
    # cross-product ground (see palette-contrast.test.mjs's exclusion list,
    # extended alongside this); each is measured only via a TARGETED,
    # theme-correct pairing (the pre-existing hero-gradient pattern), never
    # against every -ink token, which would false-positive every light -ink
    # token that never renders on the dark canvas (N1 -- the exact class of
    # error the rejected R1 spec made).
    gold: "#e6a553"
    dark-canvas: "#232323"
  logotype_selectors:
    - ".hero-subtitle" # about.html, home.scss, laboratory.scss, letter.scss, notebook.scss all style
      # the "Code Alchemist" wordmark through this one class -- AC-048's VERIFY names it exactly.
  content_threshold: 4.5   # AC-026, ratio, no rounding
  boundary_threshold: 3.0  # AC-027, ratio, no rounding

tokens:
