# Display metadata for the epistemic-status ("assay") label (Story 3.1, AC-018).
# The alchemist's purity read on a post's claims, independent of `type:`. Phase 0's
# CONVENTIONS.md fixed the closed three-value vocabulary; this file only supplies
# label/icon/gloss for rendering it. `assay:` is optional -- a post that omits it
# renders no label at all.
order:
  - speculative
  - tested
  - proven
labels:
  speculative: "Speculative"
  tested: "Tested"
  proven: "Proven"
icons:
  speculative: "fas fa-vial"
  tested: "fas fa-flask-vial"
  proven: "fas fa-mortar-pestle"
glosses:
  speculative: "An untested idea or hypothesis"
  tested: "Verified in practice, but not yet battle-hardened"
  proven: "Established, production-proven knowledge"
