<!DOCTYPE html>
<html lang="en" dir="ltr" {% if page.url == "/" %}class="home"{% endif %}>
<head>
  {% include head/meta.html %}
  {% include head/fonts.html %}
  {% include head/styles.html %}
  {% include head/analytics.html %}
  {% feed_meta %}

</head>
<body {% if page.url == "/" %}class="home"{% endif %}>
<!-- WCAG 2.4.1 (Bypass Blocks): first focusable element in the document, before the
     nav, so keyboard/screen-reader users can skip straight to the main content. The
     .skip-to-content style already existed (off-screen until :focus); this is the
     missing markup that actually renders it. -->
<a class="skip-to-content" href="#main-content">Skip to content</a>
{% include navigation.html %}

  <main class="main-content" id="main-content">
    {{ content }}
  </main>

  <!-- Story 3.2, AC-020: the footer (and its sitewide disclaimer) must render on
       EVERY page, including the homepage -- previously excluded here, which meant
       the homepage carried no disclaimer, no Start Here/Now/Uses navigation, and no
       feed link at all. -->
  {% include footer.html %}

  <!-- Custom scripts -->
  <script src="{{ "/assets/js/sigil-navigation.js" | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
