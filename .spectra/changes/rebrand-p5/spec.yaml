acceptance_constraints_detail:
  EC-1: No Opal work begins until Phase 1 (AC-004..AC-011) is closed. THE WHOLE VERDICT; everything else
    is engineering. The bytes were never the question -- the hours are.
  EC-2: Opal output loads on exactly ONE dedicated page. 0 bytes on / and article pages. home.js is NOT
    a migration target. The island's product is the POST, not widget complexity; the widget must be genuinely
    interactive and honest -- A TOKEN SPINNER IS FORBIDDEN.
  EC-3: Widget script deferred, loaded only on its page, never render-blocking. [bound by AC-052]
  EC-4: 'Opal owns NONE of: dark toggle, TOC, notebook filter/search, nav active-state, progress bar,
    share links. Empirically anchored at 30.0x the heaviest page.'
  EC-5: 'The widget page must remain meaningful with JS disabled: <noscript> + a static inline SVG of
    the circle + prose. STRENGTHENED -- a 143 KB payload failing on a slow link is a MEASURED scenario,
    not hypothetical. [bound by AC-045]'
  EC-6: 'Precompile locally; commit output to assets/js/; commit .rb source in _opal/, excluded from Jekyll
    output. No change to the Pages build source. NO `opal` in jekyll_plugins. --no-source-map is MANDATORY
    (inline source maps ship to every visitor -- the 3.5x error). --no-method-missing recommended: free
    4,028 B gz. If a map is wanted, emit a SEPARATE .map file, never inline.'
  EC-7a: 0 bytes of Opal on every page except the island. [bound by AC-041]
  EC-7b: Island PAGE TOTAL JS <= 150 KiB gz. Number NOT raised. [bound by AC-042]
  EC-7c: The `require` list IS the budget. Enumerate and cap it. `native` (+4,212 B gz) pre-authorized.
    Every other require -- opal-browser especially (UNMEASURED) -- must be measured BEFORE adoption and
    re-checked against EC-7b. Requires cost ~270 Ruby lines each; features are ~free. [bound by AC-044]
  EC-7d: VALUE FLOOR. The island must be worth 135 KiB of runtime to a reader. A token/decorative circle
    FAILS this gate. If it cannot clear the floor, DO NOT BUILD IT -> fall back to Ruling 2. This gate
    is what makes EC-7b's disclosure honest rather than incriminating. [bound by AC-046 -- irreducibly
    social, enforced AS A DISCLOSURE]
  EC-8: Opal health/compat. DISCHARGED -- opal 1.8.3 verified healthy under project Ruby. Demoted to a
    re-check condition; see discharged_constraints + RC-2.
  EC-9: 'A11y. (1) prefers-reduced-motion does NOT discharge WCAG 2.2.2 -- ''the most commonly-believed
    false thing in this whole area''. (2) Prefer a FINITE animation <=5s (inscribe -> flare -> settle):
    2.2.2 then does not apply at all and you owe no pause control. (3) If an infinite loop is non-negotiable,
    a visible themed pause control is MANDATORY -- budget it as a persona feature. (4) No-motion-first:
    default animation:none, enable under --motionOK. (5) Substitute, don''t delete under `reduce` -- rotation
    -> static sigil + opacity breath. (6) Inline SVG, NOT canvas -- SVG has a DOM, so it can be made accessible;
    survives forced-colors. (7) Keyboard-operable; visible focus; no focus trap; aria-hidden on pure ornament,
    ONE method, never stacked with alt=''''. [bound by AC-050, AC-051]'
  EC-10: 'Drift gate: CI/pre-commit asserts committed JS matches compiled source. MUST PIN THE EXACT FLAG
    SET (--no-source-map, --no-method-missing, require list) -- a drift check that doesn''t pin flags
    cannot detect a source map creeping back in. [bound by AC-043]'
  EC-11: 'The ratchet is explicit: any expansion beyond one island -- including ''just the toggle too''
    -- is a NEW DECISION REQUIRING A NEW VERDICT, not an increment.'
  EC-12: Ruling 2's work is plan-internal (Phases 2/3, AC-013) and proceeds INDEPENDENTLY of any Opal
    decision. Sell it as correctness/a11y/SEO, NOT performance.
  EC-13: Re-measure the real artifact before commit. 143,453 is a PROXY built for the probe, not the shipped
    widget. Record final gz bytes + the tier decomposition. That number is the post's spine. [bound by
    AC-059 -- NOT AC-046; v0.3 collapsed the two and LOST EC-13 entirely]
reversal_conditions_detail:
  RC-1: If a future Opal brings runtime+corelib+app within the current total JS byte budget (~2x of hand-written
    JS), Ruling 1 is void -> re-open H1. TESTED AT 30.0x -- DID NOT FIRE. The margin is not close, so
    the conclusion is insensitive to measurement error.
  RC-2: Re-check Opal/Ruby health on any major upgrade. EC-8's discharge is CONDITIONAL ON THIS. Live,
    because Phase 5 is sequenced last.
  RC-3: If the owner drops the alchemist metaphor, the island loses its content rationale -> H2/H4 win
    outright.
  RC-5: If Phase 1 has not closed within a period the owner considers reasonable, EC-1 HARDENS FROM GATE
    TO NO.
  RC-6: If the boundary is breached once (Opal on / or in post.html), the gate has failed -> revert to
    Ruling 2.
  RC-7: If opal-browser or any second require is measured and pushes the island past EC-7b, the island
    ships WITHOUT it or NOT AT ALL. The require list is not negotiable upward after the fact.
  RC-8: 'If the widget cannot clear EC-7d''s value floor, DO NOT BUILD IT -- write the post from the probe
    data already in hand. ALREADY SATISFIED: the 96.6/2.9/0.49 decomposition is a complete, publishable
    insight that requires building NOTHING.'
