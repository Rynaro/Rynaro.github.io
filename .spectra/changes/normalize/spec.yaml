open_decisions:
- id: D-A
  topic: spacing scale / radius
  options:
  - unify base-4
  - unify base-5
  - keep two named scales
  - tokenize radius only
  sub_choice:
    D-A-1: 1:1 radius tokenization (11 tokens) — ZERO pixel movement, baseline-free
    D-A-2: collapse to ~5 semantic tiers — moves pixels <=2px at ~37 sites, REQUIRES P0
  measured:
    base-4:
      4px: 61
      8px: 51
      12px: 10
      32px: 10
    base-5:
      10px: 48
      15px: 27
      5px: 25
      30px: 13
    shared:
    - 20px
    - 40px
    radius_distinct_values: 11
    radius:
      8px: 20
      10px: 17
      4px: 10
      6px: 8
      20px: 8
      3px: 4
      40px: 2
      24px: 2
      5px: 1
      30px: 1
      12px: 1
  recommendation: 'D-A-2 if P0 lands, else D-A-1. DEFER the base-4/base-5 spacing unification to a post-P4
    change: it is orthogonal to ITCSS/BEM and is the largest pixel-moving action in the program. If ever
    unified, prefer base-4 (tie-break on convention; populations are within 1%).'
  decided_by: owner
- id: D-B
  topic: harness migration vs monolithic _variables.scss
  recommendation: 'Migrate: scss-scan.mjs recurses + meta.source becomes a directory glob, as P2 story
    2.1, landing ALONE and FIRST (AC-204). Selected hypothesis H-B (75.5, solid) over H-A 65.5 / H-D 70.5
    / H-C 62.'
  rationale: 'Forgoing the split forfeits P2''s deliverable to avoid ~2 lines of scanner change. The real
    work is the meta.source glob and the strengthened anti-vacuity guard: today''s guard (token-usage.test.mjs:65)
    only catches a TOTAL wipeout, so a scanner skipping one subdirectory yields a green suite measuring
    nothing.'
  decided_by: owner
- id: D-C
  topic: dark mode unification
  measured:
    class_toggle_present_in:
    - _layouts/post.html
    standalone_pages_without_toggle: 15
    mechanisms:
    - body.dark-mode (JS, _layouts/post.html:308-322)
    - prefers-color-scheme (@mixin dark-mode, _sass/_breakpoints.scss:63)
  wcag: NO WCAG AA criterion requires a manual dark-mode toggle. 1.4.3/1.4.11 apply to whatever is rendered
    in either state; 1.4.8 (user control of colours) is AAA and scoped to text blocks. Deleting the toggle
    creates no violation; keeping it satisfies no specific AA criterion. Argue it on UX, not compliance.
  recommendation: 'Separate mechanism from policy. P1 converges the MECHANISM (one flip block, applied
    via both prefers-color-scheme and a data-theme attribute). P3 decides the POLICY (markup is P3''s
    domain). Recommended policy: promote the toggle sitewide via data-theme — a control present on 1 of
    ~16 page types is the one indefensible state — but note this doubles the dark surface area unless
    the mechanism converges first. Deleting the toggle is a legitimate alternative and costs no compliance.
    Interim: do not delete a working feature.'
  decided_by: owner
- id: D-D
  topic: .section-icon badge colour (added by mid-task correction; independently re-measured)
  root_cause: 'NAMING/ISOLATION defect: .section-icon names two components — an inline icon (class ON
    the <i>, 4 definitions, 21 of 22 markup sites) and a circular badge wrapper (class on a <div>, 1 definition,
    1 site: _layouts/post.html:106). The import-order collision is a SYMPTOM. Repair = BEM split into
    two blocks; NOT a cascade tweak, NOT !important.'
  measured_on_ground: '--ff-purple-light #b19cd9 (NOT in declared_backgrounds — no test ever measured
    this badge in either state)'
  options:
  - option: keep the darker ink (status quo by accident)
    fg: '#783cb4'
    ratio: 2.78
    note: best of the two current candidates; still <3.0; zero change
  - option: restore the intended white
    fg: '#ffffff'
    ratio: 2.43
    note: DO NOT — the accident is BETTER than the design; restoring intent REGRESSES visibility
  - option: darken the badge ground
    ground: 'darken(#b19cd9,20%) = #7752bd'
    fg: '#ffffff'
    ratio: 5.64
    note: clears 3.0; shifts the badge's visual identity toward --ff-purple-ink
  - option: drop the badge; use the inline form
    ratio: null
    note: RECOMMENDED — resolves the naming defect and the colour question in one move; the only option
      that removes rather than adds; the badge is the 1-of-22 outlier
  severity: Decorative icon (adjacent <h3 class='toc-title'>Contents</h3> carries the meaning) => WCAG
    1.4.11 does NOT bite. Visual/architectural defect, NOT an a11y failure. NO 3.0/4.5 threshold is asserted
    for it — that would be a fabricated requirement.
  current_state: both candidates unmeasured-and-below-3.0, decorative so non-blocking
  recommendation: drop the badge, adopt the inline form; owner-gated (visible design change) and P0-gated
  decided_by: owner
rejected_alternatives:
- id: H-A
  score: 65.5
  verdict: weak
  summary: keep _variables.scss monolithic, forgo the ITCSS token split
- id: H-C
  score: 62
  verdict: weak
  summary: generate _variables.scss from the manifest (codegen single source of truth)
- id: H-D
  score: 70.5
  verdict: solid
  summary: retarget the harness at COMPILED CSS, decoupling it from source layout permanently
  why_rejected: needs a Jekyll build in the test loop (performance 4) and rebuilds the a11y suite — the
    trust anchor — mid-refactor
  carry_forward: 'highest correctness (9): it would have caught the .section-icon collision, invisible
    to a per-file source scan. P3''s collision detector (AC-301, AC-306) should read the COMPILED stylesheet.
    Revisit wholesale after P4.'
gaps:
- id: GAP-1
  blocking: false
  summary: 'RESOLVED at R1: P0 landed DURING this planning session (test:visual + test:visual:update;
    84 baselines; 0.1% tolerance; dark via colorScheme for all targets + body.dark-mode for post). RESIDUAL:
    a green test:visual run was never observed by the planner (aborted EADDRINUSE port 4174, consistent
    with the concurrent P0 agent). Confirm a clean run before relying on the gate.'
- id: GAP-2
  blocking: false
  summary: 'Exact partition of dark hex occurrences into flip declarations vs compensation literals is
    uncomputed. Raw measured totals over _sass/*.scss: #e0e0e0 25, #2c2c2c 12, #b0b0b0 10, #232323 7,
    #909090 4 = 58. Scout reports ~51 compensation literals (24/12/10/6/4). Delta is consistent with flips
    being counted in the raw grep, but that was NOT verified. AC-102 requires the census script to COMPUTE
    the partition.'
- id: GAP-3
  blocking: false
  summary: Whether extending declared_backgrounds surfaces failing pairs, and how many, is unknown until
    run. AC-105/AC-106 specify the PROCEDURE, not the outcome.
- id: GAP-4
  blocking: true
  summary: D-A, D-B, D-C, D-D unresolved. Recommendations given; the owner decides.
- id: GAP-5
  blocking: false
  summary: Which .share-button definition was intended is unknowable from source (_components.scss:214
    2.5rem+::before overlay vs _post.scss:477 36px+.twitter/.linkedin; post imported later so the rendered
    button is a hybrid matching neither). AC-207 sidesteps it by preserving the COMPUTED result. A designed
    button is a separate change.
- id: GAP-6
  blocking: false
  summary: Scout's Sass deprecation figures (35 @import, 15 darken()) are WARNING counts; measured 16
    @import statements and 18 darken() call sites. No Sass build was run to reconcile warnings-vs-occurrences.
    Direction unambiguous; exact warning count not load-bearing and not asserted.
- id: GAP-7
  blocking: false
  summary: 'Post pages in OS-dark WITHOUT the toggle land in a mixed state: _post.scss flips --dnd-brown/--post-background
    only under body.dark-mode and has NO prefers-color-scheme block, while _base/_laboratory/_notebook/_letter
    flip :root globally under prefers-color-scheme. What that actually renders was NOT verified. P0''s
    post-target dark baseline can now answer it; first thing P1 should inspect.'
evidence_method: 'Counts are raw `grep -roE` occurrence counts over _sass/*.scss — not usage-weighted,
  not deduped by rule. Contrast ratios computed with the project''s own scripts/lib/color-math.mjs. Where
  my count diverges from the scout''s, both are given. (Method stated per the rebrand retraction lesson:
  a figure produced by a method that does not match how the artifact is served must be retracted.)'
