r1_findings:
  p0_landed_mid_session: true
  RETRACTED_at_R2: 'The live_wcag_failure block below was FALSE - produced by per-partial reasoning
    about document-scoped :root. --dnd-brown is flipped to #e0e0e0 SITEWIDE by the last-imported
    _letter.scss dark block, so .item-rarity-label/.scroll-seal render #e0e0e0 (not #6d562f) in dark.
    The 2.26/2.01 figures are RETRACTED and must not be reused. See r2_findings.'
  live_wcag_failure_discovered_RETRACTED:
    token: --dnd-brown
    claimed_measured_RETRACTED:
      '#6d562f on #232323': 2.26
      '#6d562f on #2c2c2c': 2.01
    why_false: '--dnd-brown resolves to #e0e0e0 in dark (last-import-wins from _letter.scss:827), so
      #6d562f never renders on #232323/#2c2c2c in dark; .item-rarity-label is #e0e0e0 on #232323 =
      11.91 (PASSES). An independent critic scored the R1 P1 spec 45/100 on this error.'
r2_findings:
  rejected_r1_score: 45/100 (independent critic)
  real_defects_compiled_cascade:
    about_dark:
      pair: '#e0e0e0 on #ffffff'
      ratio: 1.32
      cause: '_about.scss has ZERO dark handling; the --dnd-brown text token flips to #e0e0e0 globally
        but the white surfaces (:556,844,861,951,1099,1235,1312) never flip. Selectors
        .attribute-name:599, .category-title:714, .quest-title:882, .ability-name:1057.'
      severity: 'PRIMARY P1 defect - live WCAG 1.4.3 AA failure in OS-dark'
    scroll_seal:
      pairs:
        'light: #6d562f on #e6a553': 3.27
        'dark: #e0e0e0 on #e6a553': 1.61
      cause: '_notebook.scss:674 background var(--ff-gold) #e6a553 (never flipped); :675/:693 color
        var(--dnd-brown). Fails 4.5 in BOTH themes; ships to every visitor now (renders <span>Latest</span>).'
    item_rarity_label_PASSES:
      pair: '#e0e0e0 on #232323'
      ratio: 11.91
      note: 'NOT a defect; guarded by AC-107 against a spurious fix.'
    root_cause: 'Four conflicting prefers-dark :root blocks (_variables.scss:160, _notebook.scss:800,
      _laboratory.scss:688, _letter.scss:820); last import wins, so _notebook.scss:805/:808 and
      _laboratory.scss:693 are DEAD. P1 consolidates to one canonical dark set reachable via both
      prefers-color-scheme and :root[data-theme=dark] (D-C mechanism).'
  measurement_method: 'Every ratio computed with scripts/lib/color-math.mjs against the COMPILED
    cascade (confirmed byte-identical to the tmp/main.compiled.snapshot.css and to getComputedStyle
    on the built _site). Never per-partial.'
